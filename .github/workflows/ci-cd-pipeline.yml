name: 'Pipeline CI/CD: Demo ADR'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --- JOB 1: CONSTRUIR Y PROBAR ---
  build-and-test:
    name: Construir y Probar
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x] # Probará en 2 versiones en paralelo

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v3

      - name: 2. Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm' # Activa el caché automático

      - name: 3. Instalar dependencias (optimizado por caché)
        run: npm ci

      - name: 4. Ejecutar Pruebas
        run: npm test

      - name: 5. Construir la aplicación (Build)
        # Solo construimos 1 vez para ahorrar recursos
        if: matrix.node-version == '20.x' 
        run: npm run build

      - name: 6. Subir Artefacto de Build
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v3
        with:
          name: dist-files
          path: ./dist

  # --- JOB 2: DESPLEGAR (SIMULADO) ---
  deploy:
    name: Desplegar a Producción (Simulado)
    needs: build-and-test

    # Solo se ejecuta al hacer PUSH a MAIN (no en PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Artefacto de Build
        uses: actions/download-artifact@v3
        with:
          name: dist-files
          path: ./dist

      - name: 2. Mostrar archivos del artefacto
        run: |
          echo "Archivos listos para desplegar:"
          ls -R ./dist

      - name: 3. Simular despliegue usando el Secret
        # GitHub enmascarará el valor del secret como '***' en los logs
        # Esto prueba que el pipeline tiene acceso al secret de forma segura
        run: |
          echo "Usando el token de despliegue: ${{ secrets.DEPLOY_TOKEN }}"
          echo "Despliegue simulado... ¡Completado!"